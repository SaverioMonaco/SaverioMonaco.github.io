  - title: "Other Generative Models"
    text: |
      Classical generative models for calorimeter simulation, the multi
      universal approximator (one independent qubit per pixel, no entanglement),
      and four quantum generative models for calorimeter showers developed with
      Jamal Slim: the coherent memory register, QFAN, the interferometric QPCE
      and the compiled IQP Born machine.
    figures: []
    # Optional sub-boxes inside the chapter card: title, text, url (+ link_label),
    # paper (+ paper_label) or papers: [{url, label}, ...] for extra badges, status (a non-link note), figures
    subsections:
      - title: "Multi Universal Approximator"
        text: |
          One independent single-qubit universal approximator per output (pixel),
          all sharing the same input noise, without any entangling gate.
        url: "https://github.com/SaverioMonaco/Multi-Universal-Approximator"
        link_label: "GitHub"
        figures:
          - path: "thesis/figures/mua.svg"
            caption: ""
      - title: "Coherent Memory Register"
        text: |
          In each round a unitary entangles a work register with a memory register.
          The work register is measured to give one component of the sample, while the
          memory is never measured and carries the correlations between rounds.
        url: "https://github.com/jamalslim/comb"
        link_label: "GitHub"
        paper: "https://arxiv.org/abs/2609.23050"
        paper_label: "arXiv"
        figures:
          - path: "thesis/figures/comb.svg"
            caption: ""
      - title: "Quantum Feature Amplification Network"
        text: |
          An autoregressive model: every step runs the same circuit, with encoding
          angles computed from the pixels already generated, and a linear decoder turns
          the measured parities into the next block of pixels.
        url: "https://github.com/jamalslim/qfan_project"
        link_label: "GitHub"
        paper: "https://arxiv.org/abs/2605.16044"
        paper_label: "arXiv"
        figures:
          - path: "thesis/figures/qfan.svg"
            caption: ""
      - title: "Interferometric Quantum Polynomial Chaos Expansion"
        text: |
          Noise germs are re-uploaded at the start of every block of an interferometer,
          so the depth sets the order of the chaos expansion. One expectation value per
          qubit gives the energy of one calorimeter cell.
        url: "https://github.com/jamalslim/qpce_code"
        link_label: "GitHub"
        paper: "https://arxiv.org/abs/2608.05405"
        paper_label: "arXiv"
        figures:
          - path: "thesis/figures/qpce.svg"
            caption: ""
      - title: "Compiled IQP Born Machine"
        text: |
          An IQP Born machine for calorimeter images at 64 qubits. The mixture of IQP
          circuits is compiled into a single IQP circuit with a few ancilla qubits.
        url: "https://github.com/jamalslim/ciqp-moiqp"
        link_label: "GitHub"
        paper: "https://arxiv.org/abs/2605.27735"
        paper_label: "arXiv"
        figures:
          - path: "thesis/figures/ciqp.svg"
            caption: ""

